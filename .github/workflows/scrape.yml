name: Scrape & remix

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: 'Comma-separated handles (leave blank for all)'
        required: false
        type: string
      top:
        description: 'Top N ideas to push (leave blank for default)'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.accounts }}" ]; then ARGS="$ARGS --accounts ${{ inputs.accounts }}"; fi
          if [ -n "${{ inputs.top }}" ]; then ARGS="$ARGS --top ${{ inputs.top }}"; fi
          node run.js $ARGS
